[project]
name = "ai-learning-companion"
version = "0.1.0"
description = "Mac-only AI English learning companion through M4 in-app proactive practice."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2.0",
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "sounddevice>=0.5,<1.0; sys_platform == 'darwin'",
  "sqlalchemy>=2.0,<3.0",
  "textual>=0.80,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.scripts]
companion-core = "companion.cli:core"
companion-ui = "terminal_ui.app:run"
companion = "companion.cli:local"
companion-uat-evidence = "companion.uat_evidence:main"
companion-uat = "companion.uat:main"

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2.0",
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.23,<1.0",
  "ruff>=0.6,<1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["src"]

[[tool.mypy.overrides]]
module = ["textual.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["src", "."]
testpaths = ["tests"]
